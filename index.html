<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Month · Early Access · Casa Précis</title>
<meta name="description" content="Un acceso reservado para ti. Black Month, todo el mes de noviembre en Casa Précis.">
<meta property="og:title" content="Black Month · Early Access">
<meta property="og:description" content="Un acceso reservado para ti. Todo el mes de noviembre en Casa Précis.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://casaprecis.github.io/earlyaccess/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/17ao3l82MqKU3ZMtGFIMaC5mfxxUJt4wX=w1080">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Mulish:wght@400;600&family=Allura&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeae0;
    --paper-2:#f7f2ea;
    --brown:#5f372d;
    --red:#e01b22;
    --line:rgba(79,29,18,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--brown);font-family:'Mulish',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:min(560px, calc(100vh * 1080 / 1920));margin:0 auto}
  @supports (height:100dvh){.wrap{max-width:min(560px, calc(100dvh * 1080 / 1920))}}
  @media (max-width:600px){.wrap{max-width:none}}
  .pieza{display:block;width:100%;height:auto}
  @media (max-width:600px) and (max-aspect-ratio:9/16){.pieza{height:100vh;height:100dvh;object-fit:cover;object-position:center}}

  .hero{position:relative;container-type:inline-size}
  .hero .btn{
    position:absolute;left:50%;top:76.35%;transform:translate(-50%,-50%);
    font-size:clamp(13px,3.3cqw,18px);padding:.95em 2.1em;
    box-shadow:0 6px 18px rgba(60,25,15,.18);
  }
  .hero .btn:active{transform:translate(-50%,-50%) scale(.98)}
  .btn{
    display:inline-block;cursor:pointer;border:none;
    background:var(--brown);color:var(--paper-2);
    font-family:'Archivo Narrow',sans-serif;font-weight:700;
    font-size:17px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
    padding:16px 30px;border-radius:2px;
    transition:transform .15s ease, background .2s ease;
  }
  .btn:hover{background:#4a2a21}
  .btn:active{transform:scale(.98)}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(40,14,8,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .sheet{
    background:var(--paper-2);width:100%;max-width:520px;max-height:94vh;overflow:auto;
    padding:30px 26px 28px;border-radius:14px 14px 0 0;position:relative;
    box-shadow:0 -10px 40px rgba(0,0,0,.15);
  }
  @media(min-width:640px){.modal{align-items:center}.sheet{border-radius:6px}}
  .close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:28px;line-height:1;color:var(--brown);cursor:pointer;opacity:.6}
  .sheet h2{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
  .script{font-family:'Allura',cursive;color:var(--red);font-size:40px;text-align:center;line-height:1;margin-top:2px}
  .rule{height:2px;background:var(--red);width:60%;margin:8px auto 20px;border-radius:2px;opacity:.85}

  label{display:block;font-family:'Archivo Narrow',sans-serif;font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px}
  input[type=text],input[type=tel],input[type=email],input[type=date],select{
    width:100%;font-family:'Mulish',sans-serif;font-size:16px;color:var(--brown);
    background:transparent;border:none;border-bottom:1.5px solid var(--line);
    padding:9px 2px;border-radius:0;outline:none;-webkit-appearance:none;appearance:none;
  }
  input:focus,select:focus{border-bottom-color:var(--red)}
  input[type=date]{min-height:42px}
  .hint{font-size:12.5px;opacity:.7;margin-top:6px}
  .dias{display:flex;gap:10px}
  .dias label.opt{
    flex:1;margin:0;text-align:center;cursor:pointer;
    border:1.5px solid var(--line);padding:12px 6px;border-radius:2px;
    font-size:15px;letter-spacing:.1em;transition:all .15s ease;
  }
  .dias input{position:absolute;opacity:0;pointer-events:none}
  .dias input:checked + span{color:var(--paper-2)}
  .dias label.opt:has(input:checked){background:var(--brown);border-color:var(--brown);color:var(--paper-2)}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:12.5px;line-height:1.45;text-transform:none;letter-spacing:0;font-family:'Mulish',sans-serif}
  .check input{margin-top:3px;accent-color:var(--brown);width:16px;height:16px;flex:none}
  .submit{width:100%;margin-top:22px}
  .err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;min-height:18px}
  .hidden{display:none}

  .ok{text-align:center;padding:20px 0 6px}
  .ok p{font-size:16px;line-height:1.55;margin-top:6px}
  .ok .datos{margin-top:18px;font-family:'Archivo Narrow',sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <img class="pieza" width="1080" height="1920" src="https://lh3.googleusercontent.com/d/17ao3l82MqKU3ZMtGFIMaC5mfxxUJt4wX=w1080" alt="Casa Précis. Black Month, un acceso reservado para ti, todo el mes de noviembre. Bienvenido a una selección especial de diseño colombiano, con precios que no encontrarás todos los días. Aplican términos y condiciones.">
    <button class="btn" id="abrir" type="button">Inscríbete</button>
  </div>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="titulo">
    <button class="close" id="cerrar" type="button" aria-label="Cerrar">&times;</button>

    <div id="paso-form">
      <h2 id="titulo">Black Month</h2>
      <div class="script">Early Access</div>
      <div class="rule"></div>

      <form name="early-access-black-month" id="form" novalidate>
        <p class="hidden"><label>No llenar: <input name="bot-field"></label></p>

        <label for="nombre">Nombre y apellido</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" required>

        <label for="celular">Celular / WhatsApp</label>
        <input id="celular" name="celular" type="tel" autocomplete="tel" placeholder="+57 300 000 0000" required>

        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="email" required>

        <label for="fecha">¿Qué día nos visitas?</label>
        <input id="fecha" name="fecha" type="date" min="2026-11-13" max="2026-12-05" required>
        <p class="hint">Del 13 de noviembre al 5 de diciembre</p>

        <label for="acompanantes">¿Vienes acompañada?</label>
        <select id="acompanantes" name="acompanantes">
          <option value="Sola">Vengo sola</option>
          <option value="+1">+1</option>
        </select>

        <label class="check"><input type="checkbox" name="autorizacion" value="Sí" required>
          <span>Autorizo a Casa Précis a tratar mis datos para gestionar mi registro y enviarme información de sus eventos, según la Ley 1581 de 2012.</span>
        </label>

        <button class="btn submit" type="submit" id="enviar">Registrarme</button>
        <p class="err" id="err"></p>
      </form>
    </div>

    <div id="paso-ok" class="ok hidden">
      <h2>¡Listo!</h2>
      <div class="script">te esperamos</div>
      <div class="rule"></div>
      <p>Tu acceso quedó reservado. Nos encantará verte por allá.</p>
      <p class="datos" id="ok-fecha"></p>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById('modal');
  const abrir = () => { modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); };
  const cerrar = () => { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); };
  document.getElementById('abrir').addEventListener('click', abrir);
  document.getElementById('cerrar').addEventListener('click', cerrar);
  modal.addEventListener('click', e => { if (e.target === modal) cerrar(); });

  const form = document.getElementById('form');
  const btn = document.getElementById('enviar');
  const err = document.getElementById('err');
  const GF = 'https://docs.google.com/forms/d/e/1FAIpQLSfSM8mTNpCXvG5Ip8sMl1bP9z4v025BVq4ZayRdPyxMU95j6A/formResponse';
  const MAP = {nombre:'entry.1844400999', celular:'entry.269933923', correo:'entry.1501853846', dia:'entry.1670511886', acompanantes:'entry.66844474', autorizacion:'entry.2029191896'};
  const fechaEl = document.getElementById('fecha');
  const hoy = new Date(); const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if (iso(hoy) > fechaEl.min && iso(hoy) <= fechaEl.max) fechaEl.min = iso(hoy);
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const bonita = v => { const [y,m,d] = v.split('-').map(Number); const f = new Date(y, m-1, d); const t = DIAS[f.getDay()] + ' ' + d + ' de ' + MESES[m-1]; return t.charAt(0).toUpperCase() + t.slice(1); };
  form.addEventListener('submit', e => {
    e.preventDefault();
    err.textContent = '';
    if (!form.checkValidity()) {
      const bad = form.querySelector(':invalid');
      err.textContent = bad && bad.type === 'checkbox' ? 'Necesitamos tu autorización para registrarte.' : bad && bad.id === 'fecha' ? 'Elige un día entre el 13 de noviembre y el 5 de diciembre.' : 'Revisa que todos los datos estén completos.';
      if (bad && bad.focus) bad.focus();
      return;
    }
    if (form.elements['bot-field'].value) return;
    const fd = new FormData(form);
    fd.set('dia', bonita(fechaEl.value));
    const body = new URLSearchParams();
    for (const [k, id] of Object.entries(MAP)) body.append(id, (fd.get(k) || '').toString().trim());
    body.append('entry.1905665576', 'Web Early Access');
    btn.disabled = true; btn.textContent = 'Enviando…';
    fetch(GF, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() })
    .then(() => {
      document.getElementById('paso-form').classList.add('hidden');
      document.getElementById('paso-ok').classList.remove('hidden');
      document.getElementById('ok-fecha').textContent = 'Te esperamos el ' + fd.get('dia').toLowerCase();
    })
    .catch(() => {
      err.textContent = 'No se pudo enviar. Revisa tu conexión e inténtalo otra vez.';
      btn.disabled = false; btn.textContent = 'Registrarme';
    });
  });
</script>
</body>
</html>
